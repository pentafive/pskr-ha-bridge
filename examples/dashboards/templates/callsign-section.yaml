  - cards:
      - type: heading
        heading: ${CALLSIGN}
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Top Band
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_most_active_band') }}"
            icon: mdi:chart-bar
            layout: horizontal
            fill_container: true
            entity: sensor.pskreporter_${CALL_LOWER}_most_active_band
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Top Mode
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_most_active_mode') }}"
            icon: mdi:waveform
            layout: horizontal
            fill_container: true
            entity: sensor.pskreporter_${CALL_LOWER}_most_active_mode
            tap_action:
              action: more-info
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Total Spots
                secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_total_spots') }}"
                icon: mdi:radar
                layout: horizontal
                entity: sensor.pskreporter_${CALL_LOWER}_total_spots
                icon_color: "${COLOR}"
                tap_action:
                  action: more-info
              - type: custom:mini-graph-card
                entities:
                  - sensor.pskreporter_${CALL_LOWER}_total_spots
                hours_to_show: 24
                points_per_hour: 4
                line_color: "${COLOR}"
                show:
                  name: false
                  icon: false
                  state: false
                  legend: false
                  labels: false
                height: 80
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Unique Stations
                secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_unique_stations') }}"
                icon: mdi:account-multiple
                layout: horizontal
                entity: sensor.pskreporter_${CALL_LOWER}_unique_stations
                icon_color: "#ff9800"
                tap_action:
                  action: more-info
              - type: custom:mini-graph-card
                entities:
                  - sensor.pskreporter_${CALL_LOWER}_unique_stations
                hours_to_show: 24
                points_per_hour: 4
                line_color: "#ff9800"
                show:
                  name: false
                  icon: false
                  state: false
                  legend: false
                  labels: false
                height: 80
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Spots/Min
                secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_spots_per_minute') }}"
                icon: mdi:speedometer
                layout: horizontal
                entity: sensor.pskreporter_${CALL_LOWER}_spots_per_minute
                icon_color: "#4caf50"
                tap_action:
                  action: more-info
              - type: custom:mini-graph-card
                entities:
                  - sensor.pskreporter_${CALL_LOWER}_spots_per_minute
                hours_to_show: 24
                points_per_hour: 4
                line_color: "#4caf50"
                show:
                  name: false
                  icon: false
                  state: false
                  legend: false
                  labels: false
                height: 80
      # v2.3.0 Extended Metrics
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Propagation
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_propagation_score') }}"
            icon: mdi:chart-line-variant
            layout: horizontal
            entity: sensor.pskreporter_${CALL_LOWER}_propagation_score
            icon_color: "#9c27b0"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: DX Ratio
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_dx_ratio') }}%"
            icon: mdi:earth-arrow-right
            layout: horizontal
            entity: sensor.pskreporter_${CALL_LOWER}_dx_ratio
            icon_color: "#00bcd4"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Countries
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_unique_countries') }}"
            icon: mdi:flag-variant
            layout: horizontal
            entity: sensor.pskreporter_${CALL_LOWER}_unique_countries
            icon_color: "#ff5722"
            tap_action:
              action: more-info
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Avg SNR
                secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_average_snr') }} dB"
                icon: mdi:signal
                layout: horizontal
                icon_color: "#ffc107"
                entity: sensor.pskreporter_${CALL_LOWER}_average_snr
                tap_action:
                  action: more-info
              - type: custom:mini-graph-card
                entities:
                  - entity: sensor.pskreporter_${CALL_LOWER}_average_snr
                    color: "#ffc107"
                hours_to_show: 24
                points_per_hour: 4
                color_thresholds:
                  - value: -15
                    color: "#f44336"
                  - value: -10
                    color: "#ffc107"
                  - value: -5
                    color: "#8bc34a"
                show:
                  name: false
                  icon: false
                  state: false
                  legend: false
                  labels: false
                height: 80
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Max Distance
                secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_maximum_distance') | float(0) | round(0) | int }} mi"
                icon: mdi:map-marker-distance
                layout: horizontal
                icon_color: "#e91e63"
                entity: sensor.pskreporter_${CALL_LOWER}_maximum_distance
                tap_action:
                  action: more-info
              - type: custom:mini-graph-card
                entities:
                  - entity: sensor.pskreporter_${CALL_LOWER}_maximum_distance
                    color: "#e91e63"
                hours_to_show: 24
                points_per_hour: 4
                show:
                  name: false
                  icon: false
                  state: false
                  legend: false
                  labels: false
                height: 80
      # Farthest Station (v2.3.0)
      - type: custom:mushroom-template-card
        primary: Farthest Station
        secondary: >-
          {{ states('sensor.pskreporter_${CALL_LOWER}_farthest_station') }}
          ({{ state_attr('sensor.pskreporter_${CALL_LOWER}_farthest_station', 'distance_km') | float(0) | round(0) | int }} km)
        icon: mdi:antenna
        layout: horizontal
        entity: sensor.pskreporter_${CALL_LOWER}_farthest_station
        icon_color: "#e91e63"
        tap_action:
          action: more-info
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Connection
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_connection_status') }}"
            icon: mdi:connection
            layout: horizontal
            icon_color: >-
              {{ '#4caf50' if is_state('sensor.pskreporter_${CALL_LOWER}_connection_status', 'Connected') else '#f44336' }}
            entity: sensor.pskreporter_${CALL_LOWER}_connection_status
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Feed
            secondary: "{{ states('sensor.pskreporter_${CALL_LOWER}_feed_status') }}"
            icon: mdi:heart-pulse
            layout: horizontal
            icon_color: >-
              {{ '#4caf50' if 'Healthy' in states('sensor.pskreporter_${CALL_LOWER}_feed_status') else '#ff9800' }}
            entity: sensor.pskreporter_${CALL_LOWER}_feed_status
            tap_action:
              action: more-info
    column_span: 1
